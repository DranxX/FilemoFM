[package]
name = "filemofm"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["image"] }
egui-phosphor = "0.12"

rusqlite = { version = "0.31", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "v5"] }

rfd = "0.15"
open = "5"
directories = "6"
notify = "7"

rayon = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fff-search = { version = "=0.11.0", default-features = false, features = ["ripgrep"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
trash = "5.2.3"
pulldown-cmark = "0.13"
sha2 = "0.10"
fs2 = "0.4"
file-id = "0.2.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
