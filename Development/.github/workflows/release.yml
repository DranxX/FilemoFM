name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  artifact: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, artifact: linux-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    artifact: windows-amd64 }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc,   artifact: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/filemofm.exe" "dist/filemofm-${{ matrix.artifact }}.exe"
          else
            cp "target/${{ matrix.target }}/release/filemofm" "dist/filemofm-${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: filemofm-${{ matrix.artifact }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "FilemoFM v0.5.5 — portable file manager for Windows and Linux (amd64/arm64), built with Rust and egui.

          Personal project, under active development — expect rough edges.
          Linux binaries need X11/Wayland libraries at runtime (already present on standard desktops)."
